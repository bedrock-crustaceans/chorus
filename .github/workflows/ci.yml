name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          add-rust-environment-hash-key: false
          shared-key: "chorus-cache"
          cache-on-failure: false
          cache-all-crates: true

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all

  fmt:
    name: Formatting
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          add-rust-environment-hash-key: false
          shared-key: "chorus-cache"
          cache-on-failure: false
          cache-all-crates: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features

  windows:
    name: Windows
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          shared-key: "chorus-cache-windows"
          cache-on-failure: false
          cache-all-crates: true

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace

  worldgen-checksum:
    name: Worldgen checksum
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: false
          shared-key: "chorus-cache-release"
          cache-on-failure: false
          cache-all-crates: true

      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p chorus_worldgen -- --ignored output_checksum --nocapture
