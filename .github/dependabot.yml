# Dependency updates, once a week. One entry per ecosystem, so no update is proposed twice.
version: 2

updates:
  # The workspace, found from its root: listing the members as directories of their own makes
  # Dependabot read each as a separate project, and their path dependencies no longer resolve.
  # `Cargo.lock` is not committed, and a requirement is only raised when a release falls outside
  # it, so a compatible release (a patch, or a minor from 1.0 on) opens no pull request.
  - package-ecosystem: cargo
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Let a release sit before proposing it; a yanked or broken one rarely lasts that long.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    # The first group a crate matches wins.
    groups:
      bevy:
        patterns: ["bevy_*"]
      facet:
        patterns: ["facet", "facet-*"]
      rustcrypto:
        patterns: ["md-5", "sha2"]
      strum:
        patterns: ["strum", "strum_macros"]
      # Any other crate: one pull request per crate, however many manifests name it.
      per-crate:
        group-by: dependency-name

  # The actions of the workflows, all in one pull request.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    labels: [dependencies]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
