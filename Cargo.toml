[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
authors = ["OmniacDev"]

[workspace.lints.clippy]
# Bevy systems take every query and resource as an argument, so long signatures and nested query
# types are how they are written.
too_many_arguments = "allow"
type_complexity = "allow"

# `Cargo.lock` is not committed. Each requirement is the oldest version known to work, and only
# a release outside it (a new major, or a new minor before 1.0) needs a change here.
[workspace.dependencies]
chorus_core = { path = "crates/core" }
chorus_block = { path = "crates/block" }
chorus_block_schema = { path = "crates/block_schema" }
chorus_entity = { path = "crates/entity" }
chorus_item = { path = "crates/item" }
chorus_level = { path = "crates/level" }
chorus_worldgen = { path = "crates/worldgen" }
chorus_network = { path = "crates/network" }
chorus_nethernet = { path = "crates/nethernet" }

bevy_app = "0.20.1"
bevy_ecs = { version = "0.20.1", features = ["debug", "multi_threaded"] }
bevy_tasks = { version = "0.20.1", features = ["multi_threaded"] }

bedrock = { git = "https://github.com/bedrock-crustaceans/bedrock-rs", branch = "main", features = ["level", "network", "protocol", "auth", "form", "protocol-packet-meta", "protocol-packet-dyn", "protocol-unknown", "protocol-v2225", "auth-ureq"] }
bevy-nethernet = { git = "https://github.com/bedrock-crustaceans/nethernet", branch = "main" }
bevy-raknet = { git = "https://github.com/bedrock-crustaceans/raknet", branch = "main" }
# TODO: use crates.io after 4.0.0 release
nbtx = { git = "https://github.com/bedrock-crustaceans/nbtx" }

atomicow = "1.2.0"
crossbeam-channel = "0.5.17"
dhat = "0.3.3"
indexmap = "2.14.2"
rustc-hash = "2.1.3"
slotmap = "1.1.1"

facet = { version = "0.50.0-rc.7", features = ["uuid"] }
facet-json = "0.50.0-rc.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", features = ["preserve_order"] }

base64 = "0.23.1"

tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

chrono = "0.4.45"
glam = "0.34.3"
md-5 = "0.11.0"
sha2 = "0.11.1"
rand = "0.10.3"
semver = "1.0.28"
spin_sleep = "1.3.3"
crossterm = "0.29.0"
signal-hook = "0.4.6"
indicatif = "0.18.6"
humantime = "2.4.0"
strum = "0.28.0"
strum_macros = "0.28.0"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
uuid = { version = "1.29.2", features = ["v4"] }
xxhash-rust = { version = "0.8.19", features = ["xxh64"] }
zip = "9.5.1"

[package]
name = "chorus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
debug = ["chorus_level/debug", "chorus_worldgen/debug"]

[dependencies]
chorus_core.workspace = true
chorus_block.workspace = true
chorus_entity.workspace = true
chorus_item.workspace = true
chorus_level.workspace = true
chorus_worldgen.workspace = true

bevy_app.workspace = true
bevy_ecs.workspace = true
bevy_tasks.workspace = true
bedrock.workspace = true
chorus_network.workspace = true
chorus_nethernet.workspace = true
nbtx.workspace = true
atomicow.workspace = true
crossbeam-channel.workspace = true
indexmap.workspace = true
facet.workspace = true
facet-json.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
glam.workspace = true
rand.workspace = true
semver.workspace = true
sha2.workspace = true
spin_sleep.workspace = true
crossterm.workspace = true
signal-hook.workspace = true
indicatif.workspace = true
uuid.workspace = true
xxhash-rust.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
