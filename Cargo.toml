[package]
name = "chorus"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
authors = ["OmniacDev"]

[lib]
path = "src/lib.rs"

[dependencies]
bevy_app = "0.19.1"
bevy_ecs = { version = "0.19.1", features = ["debug", "multi_threaded"] }
bevy_tasks = { version = "0.19.1", features = ["multi_threaded"] }

bedrock = { git = "https://github.com/bedrock-crustaceans/bedrock-rs", branch = "main", features = ["full", "form", "protocol-packet-meta", "protocol-packet-dyn", "protocol-unknown", "protocol-v2193"] }
bevy-nethernet = { git = "https://github.com/bedrock-crustaceans/nethernet", branch = "main" }
bevy-raknet = { git = "https://github.com/bedrock-crustaceans/raknet", branch = "main" }
# TODO: use crates.io after 4.0.0 release
nbtx = { git = "https://github.com/bedrock-crustaceans/nbtx" }

atomicow = "1.2.0"
crossbeam-channel = "0.5.17"
indexmap = "2.14.2"
rustc-hash = "2.1.3"
slotmap = "1.1.1"

facet-json = "0.50.0-rc.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

base64 = "0.23.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
p384 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }

tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

chrono = "0.4.45"
glam = "0.33.11"
rand = "0.10.3"
spin_sleep = "1.3.3"
strum = "0.28.0"
strum_macros = "0.28.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
uuid = { version = "1.26.1", features = ["v4"] }
zip = "8.6.0"
